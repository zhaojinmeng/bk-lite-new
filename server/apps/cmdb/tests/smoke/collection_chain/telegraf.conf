[agent]
  interval = "1s"
  flush_interval = "1s"
  round_interval = false
  omit_hostname = true

[[inputs.nats_consumer]]
  servers = ["nats://nats:4222"]
  subjects = ["metrics.*"]
  queue_group = "cmdb-collection-smoke"
  data_format = "influx"

[[outputs.http]]
  url = "http://victoriametrics:8428/write"
  method = "POST"
  data_format = "influx"
  content_type = "application/octet-stream"
